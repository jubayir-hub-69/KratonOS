[package]
name = "kratonos-policy-vault"
version = "1.0.0"
edition = "2021"
rust-version = "1.86.0"
authors = ["KratonOS Autonomous Treasury Team"]
description = "KratonOS Sovereign Policy Vault — PoC-4 Enclave Gate, ML-DSA-65 Post-Quantum Verifier, OutLayer VRF & 3-Tier Sputnik DAO V2 Governance on NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.7.0", features = ["legacy"] }
omni-transaction = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
bs58 = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

