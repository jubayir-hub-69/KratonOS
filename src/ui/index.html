<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KratonOS Sovereign Financial Operating System — @hot-labs/near-connect Wallet Integration & Judge Verification Mode"
    />
    <title>KratonOS — Sovereign Financial Operating System on NEAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = window.sessionStorage.getItem("kratonos-ui-theme-session");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var effective =
            saved === "light" || saved === "dark" ? saved : sysDark ? "dark" : "light";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(effective);
          document.documentElement.setAttribute("data-theme", effective);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased selection:bg-[#22c55e]/25 selection:text-[#4ade80]">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
