name: KratonOS Master Verification & CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Build & Run All 6 Master Verification Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript & UI Bundle
        run: npm run build

      - name: Run 6 Master Verification Suites (38 Assertions)
        run: npm test
